[project]
name = "openclaw-ecc-orchestrator"
version = "0.1.0"
description = "Local orchestrator that runs coding agents in git worktrees with gates, approvals and a merge queue"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kenny" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ecc-orchestrator = "openclaw_ecc_orchestrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
